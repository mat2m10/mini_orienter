name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # headless wheel: no GUI libraries needed on the runner
        run: pip install "opencv-contrib-python-headless>=4.7" numpy pytest
      - name: Run tests
        run: pytest -q
